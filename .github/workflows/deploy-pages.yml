name: Deploy frontend to GitHub Pages

# Builds the React frontend and publishes it to GitHub Pages.
# The FastAPI backend is hosted separately (see DEPLOYMENT.md); its public
# origin is injected at build time through the VITE_API_URL repository variable.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages and mint the OIDC token Pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes supersede queued ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Resolves the correct base path for the Pages site (e.g. "/market-pulse")
      # whether this is a project site or a `<user>.github.io` user site.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Fail fast with a clear message instead of deploying a UI that calls /api
      # on github.io (which 404s) when the variable is missing.
      - name: Verify API URL is configured
        if: ${{ vars.VITE_API_URL == '' }}
        run: |
          echo "::error::Repository variable VITE_API_URL is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables, e.g. https://market-pulse-api.onrender.com"
          exit 1

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # Base path is provided by configure-pages; it already has a leading
          # slash but may lack a trailing one, which the vite config normalises.
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
